<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polytopia Board Editor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <main id="board-pane">
      <div id="board-wrap">
        <img id="board" alt="Board" draggable="false" />
        <canvas id="hit" width="1" height="1"></canvas>
      </div>
      <p id="status"></p>
      <aside id="debug-panel" hidden>
        <header>
          <h2 id="debug-title">Tile inspect</h2>
          <button type="button" id="debug-close" aria-label="Close debug">×</button>
        </header>
        <pre id="debug-body">Click a tile to inspect.</pre>
      </aside>
    </main>

    <aside id="sidebar">
      <header>
        <h1>Editor</h1>
        <p class="sub">Pick a brush, then click a tile.</p>
      </header>

      <section class="panel" id="share-panel">
        <h2>Load share link</h2>
        <div class="box share-box">
          <label class="sr-only" for="share-input">Polytopia share link</label>
          <input
            id="share-input"
            type="url"
            placeholder="https://share.polytopia.io/g/…"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="share-load" class="primary-btn">Load</button>
          <label class="check-row" for="share-start">
            <input id="share-start" type="checkbox" />
            Beginning of the game
          </label>
        </div>
        <p id="share-hint" class="hint">Unchecked loads the finished board; checked loads the opening turn.</p>
      </section>

      <section class="panel" id="player-panel">
        <h2>Selected player</h2>
        <div id="player-box" class="box">
          <label class="sr-only" for="player-select">Player</label>
          <select id="player-select"></select>
          <div id="player-swatch" aria-hidden="true"></div>
        </div>
      </section>

      <section class="panel" id="mod-panel">
        <h2>Modification</h2>
        <div id="mod-box" class="box">
          <span id="mod-label">None selected</span>
        </div>
      </section>

      <section class="panel" id="menus-panel">
        <h2>Brushes</h2>
        <div id="menus"></div>
      </section>
    </aside>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
